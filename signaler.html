<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1A1510">
  <title>Signaler un problème — Vie de Château</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <!--
    Formulaire public de signalement, ouvert par le QR code affiché au
    château. Il ne fait qu'une chose : envoyer un ticket au projet Apps
    Script « Signalement », qui ne sait que créer (aucune lecture).
    Le jeton est placé après le # dans le lien du QR code : il n'est donc
    jamais envoyé à GitHub ni écrit dans ce dépôt public.
    Les catégories doivent rester celles de TICKET_CATS (Code.gs de l'app).
  -->
  <style>
    :root {
      --bg: #1A1510; --card: #231D14; --card2: #2A2318;
      --border: rgba(201,168,76,0.22); --gold: #C9A84C; --gold-light: #E8C97A;
      --cream: #F5EDD8; --muted: rgba(245,237,216,0.6); --rust: #D94A2E; --green: #6BA36B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      color: var(--cream); min-height: 100vh;
      padding: 28px 16px calc(32px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at top, rgba(201,168,76,0.09), transparent 60%), var(--bg);
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .brand { text-align: center; color: var(--gold); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 28px; text-align: center; margin: 6px 0 4px; }
    .lead { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    label, .label { display: block; font-size: 15px; font-weight: 600; margin: 0 0 8px; }
    .field { margin-bottom: 20px; }
    textarea, input[type=text] {
      width: 100%; font: inherit; font-size: 17px; color: var(--cream);
      background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 14px 15px; outline: none; -webkit-appearance: none;
    }
    textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
    textarea:focus, input[type=text]:focus { border-color: var(--gold); }
    ::placeholder { color: rgba(245,237,216,0.35); }
    .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cat input { position: absolute; opacity: 0; pointer-events: none; }
    .cat span {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 78px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--card);
      font-size: 15px; font-weight: 600; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .cat span b { font-size: 26px; line-height: 1; }
    .cat input:checked + span { border-color: var(--gold); background: rgba(201,168,76,0.16); color: var(--gold-light); }
    .cat input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
    .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .send {
      width: 100%; min-height: 58px; border: 0; border-radius: 14px; cursor: pointer;
      font: inherit; font-size: 18px; font-weight: 700; color: #1A1510;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
    }
    .send:disabled { opacity: .55; cursor: default; }
    .err {
      display: none; margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14.5px;
      background: rgba(217,74,46,0.14); border: 1px solid rgba(217,74,46,0.4); color: #F2A08F;
    }
    .err.show { display: block; }
    .done { display: none; text-align: center; padding-top: 30px; }
    .done .ok { font-size: 64px; }
    .done h2 { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 26px; margin: 10px 0 8px; }
    .done p { color: var(--muted); font-size: 15px; margin-bottom: 28px; line-height: 1.45; }
    .again {
      width: 100%; min-height: 54px; border-radius: 14px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 600;
      background: transparent; color: var(--gold); border: 1.5px solid var(--gold);
    }
    .bad { display: none; text-align: center; padding-top: 40px; color: var(--muted); font-size: 16px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">🏰 Vie de Château</div>
  <h1>Signaler un problème</h1>

  <form id="form" novalidate>
    <p class="lead">L'équipe de maintenance recevra votre signalement.</p>

    <div class="field">
      <label for="problem">Quel est le problème ?</label>
      <textarea id="problem" maxlength="1000" placeholder="Ex. : la chasse d'eau fuit, une prise ne marche plus…"></textarea>
    </div>

    <div class="field">
      <label for="place">Où ?</label>
      <input type="text" id="place" maxlength="120" autocomplete="off"
             placeholder="Ex. : cuisine, chambre 12, orangerie…">
    </div>

    <div class="field">
      <div class="label" id="catLabel">Catégorie</div>
      <div class="cats" role="radiogroup" aria-labelledby="catLabel">
        <label class="cat"><input type="radio" name="cat" value="elec"><span><b>⚡</b>Électricité</span></label>
        <label class="cat"><input type="radio" name="cat" value="plomb"><span><b>💧</b>Plomberie</span></label>
        <label class="cat"><input type="radio" name="cat" value="bat"><span><b>🧱</b>Bâtiment</span></label>
        <label class="cat"><input type="radio" name="cat" value="autre"><span><b>🔧</b>Autre</span></label>
      </div>
    </div>

    <!-- Champ piège : invisible pour un humain, rempli par les robots. -->
    <div class="trap" aria-hidden="true">
      <label for="website">Site web</label>
      <input type="text" id="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="err" id="err" role="alert"></div>
    <button class="send" id="send" type="submit">Envoyer le signalement</button>
  </form>

  <div class="done" id="done" role="status">
    <div class="ok">✅</div>
    <h2>Merci !</h2>
    <p id="doneText">Votre signalement a bien été transmis à l'équipe de maintenance.</p>
    <button class="again" id="again" type="button">Signaler un autre problème</button>
  </div>

  <div class="bad" id="bad">
    Ce lien est incomplet.<br>Scannez le QR code affiché au château.
  </div>
</div>

<script>
  // Adresse du projet Apps Script « Signalement » (création seule).
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbz2MN645WtXPm8xmsyEx_Ro-hDDNnCSGJYjrYAM7ZJnxBAbNJ_UScQzmPoWP9NXQBsU/exec';
  // Délai minimal entre deux envois depuis ce téléphone.
  var COOLDOWN_MS = 20000;

  var token = (location.hash.match(/[#&]t=([A-Za-z0-9_-]+)/) || [])[1] || '';
  var form = document.getElementById('form');
  var errBox = document.getElementById('err');
  var sendBtn = document.getElementById('send');

  if (!token) {
    form.style.display = 'none';
    document.getElementById('bad').style.display = 'block';
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  function lastSent() {
    try { return Number(localStorage.getItem('vdc-signal-last')) || 0; } catch (e) { return 0; }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.classList.remove('show');
    if (sendBtn.disabled) return;   // anti double envoi

    var checked = form.querySelector('input[name=cat]:checked');
    var payload = {
      t: token,
      problem: document.getElementById('problem').value.trim(),
      place: document.getElementById('place').value.trim(),
      cat: checked ? checked.value : '',
      website: document.getElementById('website').value
    };
    var manque = [];
    if (!payload.problem) manque.push('le problème');
    if (!payload.place) manque.push('le lieu');
    if (!payload.cat) manque.push('la catégorie');
    if (manque.length) return showError('Merci d\'indiquer ' + manque.join(', ').replace(/, ([^,]*)$/, ' et $1') + '.');

    var wait = COOLDOWN_MS - (Date.now() - lastSent());
    if (wait > 0) return showError('Patientez ' + Math.ceil(wait / 1000) + ' secondes avant d\'envoyer un autre signalement.');

    sendBtn.disabled = true;
    sendBtn.textContent = 'Envoi…';
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 25000);

    // Corps en texte brut : pas de requête préalable (CORS) vers Google,
    // et aucun cookie envoyé — l'envoi reste anonyme même si le téléphone
    // est connecté à un compte Google.
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          try { localStorage.setItem('vdc-signal-last', String(Date.now())); } catch (e) {}
          document.getElementById('doneText').textContent = (res.id ? 'Votre signalement n°' + res.id : 'Votre signalement')
            + ' a bien été transmis à l\'équipe de maintenance.';
          form.style.display = 'none';
          document.getElementById('done').style.display = 'block';
          window.scrollTo(0, 0);
          return;
        }
        var code = res && res.error;
        showError(code === 'token' ? 'Ce QR code n\'est plus valide. Prévenez directement l\'équipe de maintenance.'
          : code === 'limit' ? 'Trop de signalements en ce moment. Réessayez plus tard ou prévenez directement l\'équipe.'
          : code === 'fields' ? 'Merci de remplir tous les champs.'
          : 'Envoi impossible. Réessayez dans un instant.');
      })
      .catch(function () {
        showError('Envoi impossible. Vérifiez votre connexion et réessayez.');
      })
      .then(function () {
        clearTimeout(timer);
        sendBtn.disabled = false;
        sendBtn.textContent = 'Envoyer le signalement';
      });
  });

  document.getElementById('again').addEventListener('click', function () {
    form.reset();
    errBox.classList.remove('show');
    document.getElementById('done').style.display = 'none';
    form.style.display = '';
    document.getElementById('problem').focus();
  });
</script>
</body>
</html>
