<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Vie de Château</title>
  <meta name="theme-color" content="#1A1510">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vie de Château">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #1A1510; overflow: hidden;
      overscroll-behavior: none;
    }
    #app {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; display: block;
      background: #1A1510;
    }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1A1510; color: #C9A84C;
      font-family: -apple-system, system-ui, sans-serif;
      transition: opacity .5s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .castle { font-size: 64px; margin-bottom: 14px; }
    #splash .name { font-size: 20px; letter-spacing: .04em; }
    #splash .sub { font-size: 12px; color: rgba(245,237,216,0.5); margin-top: 8px; }
    .spinner {
      margin-top: 22px; width: 28px; height: 28px;
      border: 3px solid rgba(201,168,76,0.25); border-top-color: #C9A84C;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="castle">🏰</div>
    <div class="name">Vie de Château</div>
    <div class="sub">Chargement…</div>
    <div class="spinner"></div>
  </div>

  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbxYhErtuko5Z5mEUko1FNeYE9ChSlKVRk5vAEym4v2_OQsqUbzwP_g5yFjKa_ViZqvH/exec"
    allow="camera; microphone; clipboard-write; clipboard-read; geolocation"
    allowfullscreen></iframe>

  <script>
    // Masque le splash une fois l'app chargée (ou après un délai de sécurité)
    var iframe = document.getElementById('app');
    var splash = document.getElementById('splash');
    function hideSplash() { if (splash) splash.classList.add('hide'); }
    iframe.addEventListener('load', function () { setTimeout(hideSplash, 600); });
    setTimeout(hideSplash, 8000); // filet de sécurité

    // Enregistre le service worker (rend l'app installable)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
